<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAIZIN DROP TOWER</title>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="ui">
    <div id="hud">
      <div class="chip" id="remain">のこり 10</div>
      <div class="chip" id="phase">ブロックを長押し</div>
      <div class="chip type-chip" id="blocktype">—</div>
    </div>

    <div id="wind-banner"><span id="wind-arrow">←</span><span id="wind-text">WIND</span><span id="wind-kind">BREEZE</span></div>

    <div id="judge"></div>
    <div id="combo"><span id="combo-text"></span></div>
    <div id="bubble"><span id="bubble-text"></span></div>

    <div id="title-tag">RAIZIN DROP TOWER <span>prototype</span></div>

    <div id="gauge-wrap">
      <div id="gauge-label">POWER</div>
      <div id="gauge">
        <div id="gauge-zone-good"></div>
        <div id="gauge-fill"></div>
        <div id="gauge-mark-lo" class="gauge-mark"></div>
        <div id="gauge-mark-hi" class="gauge-mark"></div>
      </div>
      <div id="gauge-pct">0%</div>
    </div>

    <div id="hint">
      <span>ブロックを長押し → 離すと叩く</span>
      <span class="sep">/</span>
      <span>何もない所を左ドラッグ・または右ドラッグで視点回転</span>
      <span class="sep">/</span>
      <span>ホイールでズーム</span>
      <span class="sep">/</span>
      <span><b>C</b> 視点リセット・<b>R</b> やり直し・<b>M</b> 音</span>
    </div>

    <div id="result">
      <div class="result-panel">
        <h1 id="result-title">GAME OVER</h1>
        <p id="result-sub"></p>
        <button id="retry">もう一度</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
